[package]
name = "inkspan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markdown = { version = "=1.0.0", features = ["serde"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"
